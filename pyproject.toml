[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.11.7,<0.12" ]

[project]
name = "picture-tool"
version = "0.1.0"
description = ""
license = "ISC"
authors = [
  { name = "Dobatymo", email = "dobatymo@users.noreply.github.com" },
]
requires-python = ">=3.8,<3.14"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "backports-strenum>=1.0.3; python_version<'3.11'",
  "c2pa-python>=0.5; python_version>='3.10'",
  "cryptography>=35; python_version>='3.10'",
  "filemeta>=0.0.2",
  "genutility[callbacks,datetime,filesdb,numpy,pickle,pillow,rich,time]>=0.0.103",
  "geopy>=2.4.1",
  "houtu>=0.0.3",
  "humanize>=4.10",
  "imagehash>=4.3.1",
  "more-itertools>=10.5",
  "msgpack>=1.1",
  "natsort>=8.4",
  "networkx>=3.1",
  "numpy>=1.20; python_version<'3.12'",
  "numpy>=1.26; python_version>='3.12'",
  "pandas>=2.0.3",
  "pandasql>=0.7.3",
  "piexif>=1.1.3",
  "pillow>=10.4",
  "pillow-avif-plugin>=1,<1.5; python_version<'3.9'",
  "pillow-avif-plugin>=1; python_version>='3.9'",
  "pillow-heif>=0.13",
  "platformdirs>=4.3.6",
  "pyarrow>=17",
  "python-dateutil>=2.8.2",
  "rawpy>=0.21",
  "requests>=2.32.4",
  "rich>=14.3.4",
  "rich-argparse>=1.7.2",
  "scipy>=1.11; python_version>='3.12'",                                           # only to fix dependency resolution
  "scipy>=1; python_version<'3.12'",                                               # only to fix dependency resolution
  "threadpoolctl>=3.5",
  "turbojpeg>=0.0.1",
  "typing-extensions>=4",
]
optional-dependencies.c2pa = [
  "c2pa-python",
  "cryptography",
]
optional-dependencies.gui = [
  "gooey>=1",
  "pyside2>=5.15.2.1; python_version<'3.9'",
  "pyside6>=6.8.0.2; python_version>='3.9'",
]
optional-dependencies.ml = [
  "concurrex>=0.0.1",
  "dlib>=19.24.6",
  "face-recognition==1.3",
  "faiss-cpu>=1.7.3",
  "image-quality>=1.2.7",
  "kornia>=0.7.3",
  "lightning>=2.3.3",
  "lmdb>=1,<2; python_version<'3.9'",                                     # only to fix dependency resolution for pyiqa
  "lmdb>=1; python_version>='3.9'",                                       # only to fix dependency resolution for pyiqa
  "opencv-contrib-python>=4.11.0.86",
  "piq>=0.8",
  "pyiqa>=0.1.10",
  "pywavelets>=1.5; python_version>='3.12'",                              # only to fix dependency resolution for scikit-image
  "pywavelets>=1; python_version<'3.12'",                                 # only to fix dependency resolution for scikit-image
  "scikit-image<0.19; python_version<'3.12'",
  "scikit-image>=0.22; python_version>='3.12'",
  "scikit-video>=1.1.11",
  "torch>=1.13.1,<2.3; python_version<'3.10' and sys_platform=='darwin'",
  "torch>=1.13.1,<2.5; python_version<'3.9' and sys_platform!='darwin'",
  "torch>=1.13.1; python_version>='3.9' and sys_platform!='darwin'",
  "torch>=1.13.1; python_version>='3.10' and sys_platform=='darwin'",
  "torchmetrics>=0.11.4",
  "torchvision>=0.14.1",
  "transformers>=4.26.1",
]
optional-dependencies.ml-tf = [
  "keras>=2.11",
  "tensorflow>=2.3",
]
scripts.batch-edit = "scripts.batch_edit:main"
scripts.batch-edit-gui = "scripts.batch_edit_gui:main"
scripts.browser-gui = "scripts.browser_gui:main"
scripts.compare-gui = "scripts.compare_gui:main"
scripts.find-dups = "scripts.find_dups:main"
scripts.viewer-gui = "scripts.viewer_gui:main"

[tool.black]
line-length = 120

[tool.ruff]
line-length = 120
lint.extend-select = [
  "B",
  "I",
  "UP",
]

[tool.isort]
profile = "black"
src_paths = [
  "picturetool",
]
line_length = 120

[tool.mypy]
allow_redefinition = true
ignore_missing_imports = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true

[dependency-groups]
dev = [
  "annoy>=1.17.1",
  "dask>=2023.3.1",
  "liccheck",
  "numba>=0.56; python_version<'3.12'",  # only to fix dependency resolution
  "numba>=0.59; python_version>='3.12'", # only to fix dependency resolution
  "numba-progress>=0.0.4",
  "py-cpuinfo>=9",
  "pyexiv2>=2.15.4",
  "pyinstaller>=6.19",
  "setuptools>=75.3.2",
]

[tool.uv]
sources.liccheck = { git = "https://github.com/dhatim/python-license-check", rev = "01bc97a8ff4237208bdfadf5801554c1a42522e0" }
build-backend.module-name = "picturetool"
build-backend.module-root = ""

[tool.bandit]
skips = [
  "B101",
]

[tool.liccheck]
authorized_licenses = [
  "2-clause bsd",
  "apache 2.0",
  "apache software license",
  "apache software",
  "apache",
  "apache-2.0",
  "bsd 3-clause",
  "bsd license",
  "bsd",
  "bsd-2-clause",
  "bsd-3",
  "bsd-3-clause",
  "gnu lgpl",
  "hpnd",
  "isc license (iscl)",
  "isc license",
  "lgpl with exceptions or zpl",
  "mit license",
  "mit",
  "modified bsd",
  "mpl-2.0",
  "new bsd license",
  "new bsd",
  "psf",
  "psf-2.0",
  "python software foundation license",
  "simplified bsd",
  "the isc",
  "unlicense",
  "zpl 2.1",
]
unauthorized_licenses = [
  "gpl v3",
  "gplv3",
]
dependencies = true
optional_dependencies = [ "gui" ]
authorized_packages.turbojpeg = "0.0.2"
